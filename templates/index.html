<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Acceso - Portería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body class="body-index">
    <h1>Control de Acceso 🏢</h1>

    <div style="margin-bottom: 25px">
      <a href="/historial" class="btn-historial">📋 Ver Historial Central</a>
      {% if rol_actual == 'administrador' %}
      <a href="/admin" style="background: #ffc107; color: black; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-left: 10px;">⚙️ Panel Admin</a>
      {% endif %}
      <a href="/logout" style="color: #dc3545; text-decoration: none; font-weight: bold; margin-left: 15px;">🚪 Salir</a>
    </div>

    <p>Portero: <strong>{{ usuario_actual }}</strong> <span class="badge badge-rol">{{ rol_actual }}</span></p>

    <hr style="width: 50%; border: 0; border-top: 1px solid #ccc; margin: 20px auto;" />

    <div id="paso-escaner">
      <p style="font-size: 1.2em; font-weight: bold;">1. Identificación del Visitante</p>
      
      <select id="tipoDocSelect" style="width: 80%; max-width: 400px; font-weight: bold;">
        {% for t in tipos_doc %}
          <option value="{{ t.id }}">{{ t.sigla }} - {{ t.nombre }}</option>
        {% endfor %}
      </select><br>

      <input type="text" id="escanerInput" class="input-escaner" placeholder="Escanea o digita el número..." autofocus autocomplete="off"/>
    </div>

    <div id="paso-apto" style="display: none">
      <p style="font-size: 1.2em; font-weight: bold;">2. Selecciona el destino</p>
      <div class="formulario-destino">
        <div class="form-group" style="text-align: center;">
          <label for="unidadSelect">{{ session.get('nom_bloque', 'Unidad') }}:</label>
          <select id="unidadSelect"></select>
        </div>
        <div class="form-group" style="text-align: center;">
          <label for="subunidadSelect">{{ session.get('nom_unidad', 'Subunidad') }}:</label>
          <select id="subunidadSelect">
            <option value="">Seleccione {{ session.get('nom_bloque', 'Unidad') }} primero</option>
          </select>
        </div>
        <div class="form-group">
          <label>Observaciones</label>
          <input type="text" id="obsInput" placeholder="Ej: Viene a trasteo..." style="width: 100%; max-width: 380px;" />
        </div>
        <div class="form-group">
          <label>Acompañantes:</label>
          <input type="number" id="acompInput" value="0" min="0" max="100" style="width: 80px; text-align: center; font-weight: bold;" />
        </div>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; width: 100%; text-align: left;">
          <label style="cursor: pointer; font-size: 1.1em">
            <input type="checkbox" id="vehiculoCheck" style="transform: scale(1.3); margin-right: 8px" />
            <strong>¿Ingresa en vehículo?</strong>
          </label><br />
          <input type="text" id="placaInput" placeholder="PLACA (Ej: ABC-123)" style="display: none; width: 100%; max-width: 200px; text-transform: uppercase; font-weight: bold; text-align: center;" />
        </div>
        
        <button id="btnGuardar" class="btn-w200">Registrar Ingreso</button>
        <button id="btnCancelar" class="btn-danger btn-w200">Cancelar</button>
      </div>
    </div>

    <div id="resultado">
      <h3 style="margin-top: 0;">Último ingreso procesado:</h3>
      <p id="info-registro" style="font-size: 18px; color: #333">Esperando primer registro del turno...</p>
    </div>

    <script>
      const nomBloque = "{{ session.get('nom_bloque', 'Unidad') }}";
      const nomUnidad = "{{ session.get('nom_unidad', 'Subunidad') }}";
      const selectUnidad = document.getElementById("unidadSelect");
      const selectSubunidad = document.getElementById("subunidadSelect");
      const selectTipoDoc = document.getElementById("tipoDocSelect");

      function cargarUnidades() {
        fetch("/api/unidades").then(res => res.json()).then(data => {
            selectUnidad.innerHTML = `<option value="">Seleccione ${nomBloque}...</option>`;
            data.forEach(u => selectUnidad.add(new Option(u.nombre, u.id)));
        });
      }

      selectUnidad.addEventListener("change", function () {
        const unidadId = this.value;
        selectSubunidad.innerHTML = `<option value="">Cargando ${nomUnidad}s...</option>`;
        if (!unidadId) { selectSubunidad.innerHTML = `<option value="">Seleccione ${nomBloque} primero</option>`; return; }
        fetch(`/api/subunidades/${unidadId}`).then(res => res.json()).then(data => {
            selectSubunidad.innerHTML = `<option value="">Seleccione ${nomUnidad}...</option>`;
            data.forEach(s => selectSubunidad.add(new Option(s.nombre, s.nombre)));
        });
      });

      let tramaTemporal = "";
      const pasoEscaner = document.getElementById("paso-escaner");
      const inputEscaner = document.getElementById("escanerInput");
      const pasoApto = document.getElementById("paso-apto");
      const infoRegistro = document.getElementById("info-registro");

      inputEscaner.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          tramaTemporal = inputEscaner.value;
          if (tramaTemporal.trim() === "") return;
          pasoEscaner.style.display = "none";
          pasoApto.style.display = "block";
        }
      });

      selectTipoDoc.addEventListener("change", () => inputEscaner.focus());
      document.getElementById("btnCancelar").addEventListener("click", reiniciarPantalla);

      document.getElementById("btnGuardar").addEventListener("click", function () {
          if (selectUnidad.value === "" || selectSubunidad.value === "") { alert(`⚠️ Debes seleccionar ${nomBloque} y ${nomUnidad}.`); return; }
          const vaEnVehiculo = document.getElementById("vehiculoCheck").checked ? 1 : 0;
          const valorPlaca = document.getElementById("placaInput").value.toUpperCase();
          if (vaEnVehiculo === 1 && valorPlaca.trim() === "") { alert("⚠️ Por favor ingresa la placa del vehículo."); document.getElementById("placaInput").focus(); return; }

          infoRegistro.innerHTML = "<b>⌛ Procesando en la nube...</b>";
          const payload = {
            trama: tramaTemporal, tipo_doc_id: selectTipoDoc.value, 
            apartamento: `${selectUnidad.options[selectUnidad.selectedIndex].text} - ${selectSubunidad.value}`,
            vehiculo: vaEnVehiculo, placa: valorPlaca,
            observaciones: document.getElementById("obsInput").value,
            acompanantes: parseInt(document.getElementById('acompInput').value) || 0
          };

          fetch("/registrar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
              if (data.mensaje === "ok") {
                const iconoVehiculo = data.vehiculo === 1 ? "🚗" : "🚶";
                const infoVehiculo = data.vehiculo === 1 ? `<b>Placa:</b> ${data.placa}` : "Peatón";
                infoRegistro.innerHTML = `<div style="color: #28a745; font-weight: bold; margin-bottom: 5px;">✅ REGISTRO EXITOSO</div><b>Destino:</b> ${data.apartamento}<br><b>Visitante:</b> ${data.nombre} (${data.numero_documento})<br><b>Transporte:</b> ${iconoVehiculo} ${infoVehiculo}<br><div style="margin-top: 5px; font-size: 0.9em; color: #666;"><b>Obs:</b> ${data.observaciones || "---"}</div>`;
                reiniciarPantalla();
              } else { infoRegistro.innerHTML = `<div style="color: #dc3545;">❌ Error: ${data.error}</div>`; }
            }).catch(() => infoRegistro.innerText = "❌ Error crítico de conexión");
        });

      function reiniciarPantalla() {
        inputEscaner.value = ""; selectUnidad.selectedIndex = 0;
        selectSubunidad.innerHTML = `<option value="">Seleccione ${nomBloque} primero</option>`;
        selectTipoDoc.selectedIndex = 0; 
        document.getElementById("vehiculoCheck").checked = false;
        document.getElementById("placaInput").value = ""; document.getElementById("placaInput").style.display = "none";
        document.getElementById("obsInput").value = ""; document.getElementById('acompInput').value = "0";
        pasoApto.style.display = "none"; pasoEscaner.style.display = "block";
        setTimeout(() => inputEscaner.focus(), 100);
      }

      document.addEventListener("click", (e) => { if (pasoEscaner.style.display !== "none" && !["A", "SELECT", "OPTION", "INPUT"].includes(e.target.tagName)) inputEscaner.focus(); });
      cargarUnidades();
      document.getElementById("vehiculoCheck").addEventListener("change", function () {
        const placa = document.getElementById("placaInput");
        placa.style.display = this.checked ? "block" : "none";
        if(this.checked) placa.focus(); else placa.value = "";
      });
    </script>
  </body>
</html>
