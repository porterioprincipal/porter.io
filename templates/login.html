<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portería</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f4f6f9; 
            margin: 0; 
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0 20px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box;
            font-size: 16px;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background: #0056b3; }
        .error { color: #dc3545; font-size: 0.9em; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Sistema visitantes PORTER.IO</h2>
        <h2>🏢 Acceso Portería</h2>
        
        {% if error %}
            <p class="error">❌ {{ error }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <div style="text-align: left;">
                <label style="font-weight: bold; font-size: 0.9em; color: #555;">Usuario:</label>
                <input type="text" name="usuario" placeholder="Ej: j.perez" required autofocus>
            </div>
            
            <div style="text-align: left;">
                <label style="font-weight: bold; font-size: 0.9em; color: #555;">Contraseña:</label>
                <input type="password" name="password" placeholder="********" required>
            </div>
            
            <button type="submit">Ingresar al Turno</button>
        </form>
    </div>

</body>
</html>
